name: Update profile cards

on:
  schedule:
    # 04:12 UTC. Avoids the midnight slot, which is the most contended and the most
    # likely to be delayed or dropped by GitHub's scheduler.
    - cron: "12 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render and print the numbers without committing"
        type: boolean
        default: false

# Two runs at once (a manual dispatch landing on the scheduled one) both render,
# then race on the push and one loses. Serialize instead.
concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    # The workflow lives in the profile repo itself, so the built-in token both
    # checks it out and commits the rendered cards back. No extra PAT needed.
    permissions:
      contents: write

    steps:
      # actions/checkout is the only action used, and it is GitHub's own. Nothing is
      # installed at run time, so no third-party code ever sees your token.
      - name: Check out the profile repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render the stats card
        env:
          # Falls back to the token Actions provides if you never made one. That one
          # sees only public activity, so rows needing private access are dropped
          # rather than filled with a public-only figure.
          STATS_TOKEN: ${{ secrets.STATS_READ_PAT || secrets.GITHUB_TOKEN }}
          STATS_USERNAME: ${{ github.repository_owner }}
          CARD_OUTPUT: profile/stats.svg

          # Only CARD_LAYOUT has to be set; the rest fall back to the layout's own
          # defaults when left empty.
          CARD_LAYOUT: "mono"   # tiles | mono
          CARD_THEME: "dark"    # dark | light | auto, which follows the viewer
          CARD_ACCENT: ""       # hex for icons and the chart; empty uses the theme's
          CARD_ICONS: "true"    # true | false

          # The contributions chart. Not a row: it replaces the whole bottom band.
          SHOW_SPARKLINE: "true"

          # Row order. Enabled metrics not named here keep their catalogue position,
          # after the named ones.
          METRIC_ORDER: "commits,commitsThisYear,prs,prsMergeRate,prsReviewed,issues,stars"

          # Flip a flag to add or drop a row. Only the APIs the enabled metrics need
          # are called, and a row the token cannot support is dropped, not guessed.
          SHOW_STARS:                   "true"
          SHOW_FORKS:                   "false"
          SHOW_WATCHERS:                "false"
          SHOW_FOLLOWERS:               "false"
          SHOW_FOLLOWING:               "false"
          SHOW_STARS_GIVEN:             "false"
          SHOW_REPOS:                   "false"
          SHOW_GISTS:                   "false"
          SHOW_ORGANIZATIONS:           "false"
          SHOW_DISK_USAGE:              "false"
          SHOW_ACCOUNT_AGE:             "false"
          SHOW_COMMITS:                 "true"
          SHOW_PRS:                     "true"
          SHOW_ISSUES:                  "true"
          SHOW_CONTRIBUTED_TO:          "false"
          SHOW_PRS_MERGED:              "false"
          SHOW_PRS_MERGE_RATE:          "true"
          SHOW_PRS_REVIEWED:            "true"
          SHOW_PRS_COMMENTED:           "false"
          SHOW_ISSUES_COMMENTED:        "false"
          SHOW_DISCUSSIONS_STARTED:     "false"
          SHOW_DISCUSSIONS_ANSWERED:    "false"
          SHOW_COMMITS_THIS_YEAR:       "true"
          SHOW_CONTRIBUTIONS_THIS_YEAR: "false"
          SHOW_STREAK_CURRENT:          "false"
          SHOW_STREAK_LONGEST:          "false"
          SHOW_ACTIVE_DAYS:             "false"
        run: node scripts/generate-card.mjs

      # A separate card: it answers a different question from a different source, and
      # a reader should be able to take one without the other.
      - name: Render the languages card
        env:
          # Falls back to the token Actions provides if you never made one. That one
          # sees only public activity, so rows needing private access are dropped
          # rather than filled with a public-only figure.
          STATS_TOKEN: ${{ secrets.STATS_READ_PAT || secrets.GITHUB_TOKEN }}
          STATS_USERNAME: ${{ github.repository_owner }}
          LANGUAGES_OUTPUT: profile/languages.svg
          CARD_THEME: "dark"
          CARD_ACCENT: ""

          # How many of the most recent pull requests to read. "all" is the default
          # because samples do not converge: on one account Terraform reads 30% over
          # the 250 most recent pull requests and 54% over all 716 — a different
          # ranking, not a rougher one. Lower it only if a run gets too slow.
          PRS_NUMBER_TO_CALCULATE_LANGUAGES: "all"

          # Names to leave out, comma separated. Empty keeps everything measured.
          EXCLUDED_LANGUAGES: ""

          # Set this and nothing is requested at all: the card draws what you declare.
          # "Terraform 54, TypeScript 21" — weights, so percentages or line counts.
          MANUAL_LANGUAGES: ""
        run: node scripts/generate-languages.mjs

      - name: Commit the cards if they changed
        if: inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/languages.svg
          git commit -m "Update profile cards" || exit 0
          # The render takes minutes; main can move under us in that window.
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
